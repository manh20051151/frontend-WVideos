# Docker compose chạy frontend snha trên server production.
#
# Lưu ý: NEXT_PUBLIC_API_URL bị nhúng vào bundle CLIENT lúc build image
# (không phải biến runtime) -> nếu đổi URL API thì phải build image mới.
#
# Cách dùng (trên server):
#   1. Tạo thư mục deploy, ví dụ: /opt/wvideos/frontend
#   2. Copy file này vào
#   3. Chạy: IMAGE=manh20051151/wvideos-frontend:latest docker compose -f docker-compose.prod.yml up -d
#      (workflow CI/CD tự chạy lệnh này khi deploy)

services:
  frontend:
    image: ${IMAGE:-manh20051151/wvideos-frontend:latest}
    container_name: wvideos-frontend
    restart: unless-stopped
    ports:
      # Chỉ mở trên localhost: Cloudflare Tunnel (cloudflared) vào được,
      # máy ngoài LAN/internet không truy cập trực tiếp được port này
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
